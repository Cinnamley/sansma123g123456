    <text x="44" y="120" class="sans" font-size="54" font-weight="700" letter-spacing="-1.6" fill="#eef2f6">Cin<tspan dx="16" dy="-4" class="mono" font-size="15" font-weight="400" letter-spacing="0" fill="#9aa5b4">@sansma123g123456</tspan></text>

    <text x="44" y="158" class="sans" font-size="15.5" font-weight="400" fill="#9aa5b4">Building responsive combat mechanics, custom 3D</text>
    <text x="44" y="182" class="sans" font-size="15.5" font-weight="400" fill="#9aa5b4">entity meshes, and OpenGL shaders for Minecraft.</text>

